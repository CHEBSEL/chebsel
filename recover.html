<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102644">
<title>CHEBSEL — Mise à jour sécurisée</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#fff;padding:24px}.card{width:min(560px,100%);background:#12223a;border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}h1{font-size:1.35rem;margin:0 0 10px}p{line-height:1.55;color:#d7e2f2}.status{margin-top:16px;padding:12px 14px;border-radius:14px;background:#0b1728;font-weight:700}.ok{color:#8ff0b5}.bad{color:#ffb4ad}button{margin-top:16px;width:100%;min-height:48px;border:0;border-radius:14px;background:#76a9ff;color:#08111f;font-weight:850;font-size:1rem}
</style>
</head>
<body>
<main class="card">
<h1>CHEBSEL — Mise à jour sécurisée</h1>
<p>Cette opération remplace uniquement l’ancien cache PWA et le service worker. Elle ne supprime pas vos membres, appels, finances, mots de passe hors-ligne, localStorage ni IndexedDB.</p>
<div id="status" class="status">Préparation de la mise à jour…</div>
<button id="retry" hidden>Réessayer</button>
</main>
<script>
(async()=>{
 const status=document.getElementById('status'),retry=document.getElementById('retry');
 try{
  if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
  if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('chebsel-')||k.includes('chebsel')).map(k=>caches.delete(k)));}
  status.textContent='✓ Ancien shell retiré. Chargement de la dernière version CHEBSEL…';status.classList.add('ok');
  setTimeout(()=>location.replace('./?pwa_recovered=1&v=1.11.1'),900);
 }catch(e){status.textContent='La mise à jour automatique a échoué : '+e.message;status.classList.add('bad');retry.hidden=false;retry.onclick=()=>location.reload();}
})();
</script>
</body>
</html>
