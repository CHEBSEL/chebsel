name: CHEBSEL v1.9.1 Responsible Sync Controls
on:
  push:
    paths:
      - '.github/workflows/v191-responsible-sync.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsible sync controls
        run: python3 scripts/v191_responsible_sync_controls.py
      - name: Bump service worker cache
        run: |
          python3 -c "from pathlib import Path; import re; p=Path('sw.js'); s=p.read_text(); p.write_text(re.sub(r'chebsel-pwa-stable-v[0-9]+','chebsel-pwa-stable-v191',s))"
      - name: Verify
        run: |
          grep -q "CHEBSEL v1.9.1" index.html
          grep -q "isResponsibleRole" index.html
          grep -q "\['president','secretary','treasurer'\]" index.html
      - name: Commit
        run: |
          git config user.name "CHEBSEL"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Release CHEBSEL v1.9.1 responsible sync controls" || exit 0
          git push
