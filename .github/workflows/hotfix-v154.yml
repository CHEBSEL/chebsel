name: CHEBSEL v1.5.4 Cloud Init Fix
on:
  push:
    paths:
      - '.github/workflows/hotfix-v154.yml'
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix cloud initialization ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const CLOUD_DEFAULT_URL="https://obgpocmsmtlpvfwblqvi.supabase.co";', 'var CLOUD_DEFAULT_URL="https://obgpocmsmtlpvfwblqvi.supabase.co";')
          s=s.replace('const CLOUD_DEFAULT_PUBLISHABLE_KEY="sb_publishable_-EcBi0HIvojuaEuzqvORRA_xwAnRFYV";', 'var CLOUD_DEFAULT_PUBLISHABLE_KEY="sb_publishable_-EcBi0HIvojuaEuzqvORRA_xwAnRFYV";')
          s=s.replace('CHEBSEL v1.5.3 — Centre de gestion','CHEBSEL v1.5.4 — Centre de gestion')
          s=s.replace('>v1.5.3<','>v1.5.4<')
          s=s.replace("const APP_VERSION='1.5.3'", "const APP_VERSION='1.5.4'")
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8').replace('chebsel-pwa-stable-v153','chebsel-pwa-stable-v154')
          sw.write_text(t,encoding='utf-8')
          PY
          git rm .github/workflows/hotfix-v154.yml
          git config user.name 'CHEBSEL Deployment'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Fix Cloud initialization TDZ on mobile PWA — v1.5.4'
          git push
