name: CHEBSEL v1.10.0 Treasury Reporting
on:
  push:
    paths:
      - '.github/workflows/v1100-treasury-reporting.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply treasury reporting
        run: python3 scripts/v1100_treasury_reporting.py
      - name: Bump service worker cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('sw.js');s=p.read_text(encoding='utf-8');s=re.sub(r'chebsel-pwa-stable-v\d+','chebsel-pwa-stable-v1100',s);p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q "CHEBSEL v1.10.0" index.html
          grep -q "id=\"treasuryExpensesView\"" index.html
          grep -q "id=\"treasuryReportView\"" index.html
          grep -q "function saveTreasuryExpense" index.html
          grep -q "function renderTreasuryReport" index.html
          grep -q "function pushCloudExpenses" index.html
          grep -q "EXPENSE_KEY='chebsel_expenses_v1'" index.html
          grep -q "chebsel-pwa-stable-v1100" sw.js
      - name: Commit
        run: |
          git config user.name "CHEBSEL"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Release CHEBSEL v1.10.0 treasury reporting" || exit 0
          git push
