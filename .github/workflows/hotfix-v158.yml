name: CHEBSEL v1.5.8 Sync Repair
on:
  push:
    paths:
      - 'deploy/v158_fix.py'
      - '.github/workflows/hotfix-v158.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.5.8 repair
        run: python3 deploy/v158_fix.py
      - name: Verify
        run: |
          grep -q "CHEBSEL v1.5.8" index.html
          grep -q "manualSyncReadyPrepare" index.html
          grep -q "repairV158Outbox" index.html
          grep -q "byLegacy" index.html
          grep -q "chebsel-pwa-stable-v158" sw.js
      - name: Commit
        run: |
          git config user.name 'CHEBSEL Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Fix pilot dedupe, stale outbox and prepare feedback v1.5.8'
          git push
