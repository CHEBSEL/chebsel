name: CHEBSEL v1.8.3 Backup Access Hardening
on:
  push:
    paths:
      - '.github/workflows/v183-backup-security.yml'
      - 'scripts/v183_backup_security.py'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restrict backup and restore to President
        run: python3 scripts/v183_backup_security.py
      - name: Bump service worker cache
        run: |
          python3 -c "from pathlib import Path; import re; p=Path('sw.js'); s=p.read_text(); p.write_text(re.sub(r'chebsel-pwa-stable-v[0-9]+','chebsel-pwa-stable-v183',s))"
      - name: Verify
        run: |
          grep -q "CHEBSEL v1.8.3" index.html
          grep -q "backupSelector" index.html
          grep -q "Sauvegarde réservée au Président" index.html
          grep -q "backupTopBtn" index.html
      - name: Commit
        run: |
          git config user.name "CHEBSEL"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Release CHEBSEL v1.8.3 backup access hardening" || exit 0
          git push