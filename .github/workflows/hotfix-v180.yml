name: CHEBSEL v1.8.0 Offline Auth + Auto Sync
on:
  push:
    paths:
      - 'scripts/patch_v180.py'
      - '.github/workflows/hotfix-v180.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.8.0 patch
        run: python scripts/patch_v180.py
      - name: Verify v1.8.0
        run: |
          grep -q "CHEBSEL v1.8.0" index.html
          grep -q "OFFLINE_AUTH_KEY" index.html
          grep -q "scheduleAutoCloudSync" index.html
          grep -q "cloudPilotSync(silent=false)" index.html
          grep -q "chebsel-pwa-stable-v180" sw.js
      - name: Commit
        run: |
          git config user.name "CHEBSEL Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Release CHEBSEL v1.8.0 offline auth and auto-sync"
          git push
