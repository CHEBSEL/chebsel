name: CHEBSEL v1.11.4 Version + Praise Verse

on:
  push:
    paths:
      - 'scripts/v1114_patch.py'
      - '.github/workflows/v1114-version-praise.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.11.4 patch
        run: python scripts/v1114_patch.py
      - name: Commit release
        run: |
          git config user.name "CHEBSEL"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js manifest.webmanifest
          if git diff --cached --quiet; then
            echo "No release changes"
          else
            git commit -m "Release CHEBSEL v1.11.4 version and praise verse"
            git push origin main
          fi
