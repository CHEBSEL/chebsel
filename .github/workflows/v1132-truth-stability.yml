name: CHEBSEL v1.13.2 Truth + Stability

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v1132_truth_stability.py'
      - 'js/stability-1132.js'
      - '.github/workflows/v1132-truth-stability.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.13.2
        run: python scripts/v1132_truth_stability.py
      - name: Validate JS
        run: |
          node --check js/stability-1132.js
          node --check js/institutional-ops.js
          node --check js/legacy-core.js
      - name: Validate release
        run: |
          grep -q 'v1.13.2' index.html
          grep -q 'stability-1132.js' index.html
          grep -q 'Clôture à valider' js/institutional-ops.js
          grep -q 'Rejenere resi' js/stability-1132.js
          grep -q 'chebsel-pwa-stable-v1132' sw.js
      - name: Commit release
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'CHEBSEL'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html js/institutional-ops.js js/bootstrap.js manifest.webmanifest sw.js
          git commit -m 'Release CHEBSEL v1.13.2 canonical truth receipt regeneration and visual stability'
          git push
