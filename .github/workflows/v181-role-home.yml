name: CHEBSEL v1.8.1 Role-Based Home
on:
  push:
    paths:
      - '.github/workflows/v181-role-home.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply role UX
        run: python3 scripts/v181_role_ux.py
      - name: Bump service worker cache
        run: |
          python3 -c "from pathlib import Path; import re; p=Path('sw.js'); s=p.read_text(); p.write_text(re.sub(r'chebsel-pwa-stable-v[0-9]+','chebsel-pwa-stable-v181',s))"
      - name: Verify
        run: |
          grep -q "CHEBSEL v1.8.1" index.html
          grep -q "ROLE_VIEW_MATRIX" index.html
          grep -q "chooseLoginRole" index.html
          grep -q "Mot de passe CHEBSEL" index.html
      - name: Commit
        run: |
          git config user.name "CHEBSEL"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Release CHEBSEL v1.8.1 role-based home" || exit 0
          git push
