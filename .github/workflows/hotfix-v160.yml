name: CHEBSEL v1.6.0 Attendance Cloud Sync
on:
  push:
    paths:
      - '.github/workflows/hotfix-v160.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.6.0 patch
        run: python3 scripts/hotfix_v160.py
      - name: Verify v1.6.0
        run: |
          grep -q "CHEBSEL v1.6.0" index.html
          grep -q "const APP_VERSION='1.6.0'" index.html
          grep -q "pushCloudAttendance" index.html
          grep -q "pullCloudAttendance" index.html
          grep -q "chebsel-pwa-stable-v160" sw.js
      - name: Commit
        run: |
          git config user.name 'CHEBSEL Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Add attendance cloud sync v1.6.0'
          git push
