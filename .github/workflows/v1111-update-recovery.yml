name: CHEBSEL v1.11.1 Update Recovery
on:
  push:
    paths:
      - 'scripts/v1111_update_recovery.py'
      - '.github/workflows/v1111-update-recovery.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply update recovery patch
        run: python scripts/v1111_update_recovery.py
      - name: Verify patch
        run: |
          grep -q "CHEBSEL v1.11.1" index.html
          grep -q "initPwaUpdateRecovery" index.html
          grep -q "updateViaCache:'none'" index.html
          grep -q "chebsel-pwa-stable-v1111" sw.js
          grep -q "SKIP_WAITING" sw.js
      - name: Commit release
        run: |
          git config user.name "CHEBSEL"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Release CHEBSEL v1.11.1 PWA update recovery"
          git push
