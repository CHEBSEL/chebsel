name: CHEBSEL v1.17.1 Secretary Scope

on:
  workflow_dispatch:
  push:
    paths:
      - 'js/secretary-scope-1171.js'
      - 'js/clean-shell-1170.js'
      - 'scripts/v1171_secretary_scope.py'
      - '.github/workflows/v1171-secretary-scope.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply secretary scope
        run: python scripts/v1171_secretary_scope.py
      - name: Validate JavaScript
        run: |
          node --check js/secretary-scope-1171.js
          node --check js/clean-shell-1170.js
          node --check js/monthly-governance-1140.js
      - name: Validate secretary wiring
        run: |
          grep -q 'CHEBSEL v1.17.1' index.html
          grep -q 'secretary-scope-1171.js' index.html
          grep -q "openSecretaryCallHub" js/clean-shell-1170.js
          grep -q "openSecretaryReportsHub" js/clean-shell-1170.js
          grep -q "Rapport mensuel de ponctualité" js/secretary-scope-1171.js
          grep -q "période libre" js/secretary-scope-1171.js
          grep -q 'chebsel-pwa-stable-v1171' sw.js
      - name: Commit release
        run: |
          if git diff --quiet; then echo 'No release diff required.'; exit 0; fi
          git config user.name 'CHEBSEL'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html manifest.webmanifest sw.js js/bootstrap.js
          git commit -m 'Release CHEBSEL v1.17.1 strict Secretary scope'
          git push
