name: CHEBSEL v1.11.0 Visual Polish
on:
  push:
    paths:
      - '.github/workflows/v1110-visual-polish.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply visual polish
        run: python scripts/v1110_visual_polish.py
      - name: Bump service worker cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'chebsel-pwa-stable-v\d+', 'chebsel-pwa-stable-v1110', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify release
        run: |
          grep -q 'CHEBSEL v1.11.0' index.html
          grep -q "const APP_VERSION='1.11.0'" index.html
          grep -q 'Visual Polish Layer' index.html
          grep -q 'function v1110FinancialPanel' index.html
          grep -q 'profileAvatar' index.html
          grep -q 'finBars' index.html
      - name: Commit release
        run: |
          git config user.name 'CHEBSEL'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Release CHEBSEL v1.11.0 visual polish'
          git push
