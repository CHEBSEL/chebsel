name: CHEBSEL v1.13.3 Payment Reason + Monthly History

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v1133_payment_reason_history.py'
      - 'js/payment-reason-history-1133.js'
      - '.github/workflows/v1133-payment-reason-history.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.13.3 patch
        run: python scripts/v1133_payment_reason_history.py
      - name: Validate JavaScript
        run: |
          node --check js/payment-reason-history-1133.js
          node --check js/stability-1132.js
          node --check js/corrections-1131.js
      - name: Validate release
        run: |
          grep -q 'v1.13.3' index.html
          grep -q 'payment-reason-history-1133.js' index.html
          grep -q 'chebsel-pwa-stable-v1133' sw.js
          grep -q 'payment-reason-history-1133.js' sw.js
      - name: Commit release
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'CHEBSEL'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html css/app.css manifest.webmanifest sw.js js/bootstrap.js
          git commit -m 'Release CHEBSEL v1.13.3 mandatory payment reasons and monthly history'
          git push
