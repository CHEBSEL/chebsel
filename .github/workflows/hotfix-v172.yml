name: CHEBSEL v1.7.2 Finance Integrity Fix

on:
  push:
    paths:
      - 'scripts/hotfix_v172.py'
      - '.github/workflows/hotfix-v172.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.7.2 patch
        run: python scripts/hotfix_v172.py
      - name: Verify v1.7.2
        run: |
          grep -q 'CHEBSEL v1.7.2' index.html
          grep -q "const APP_VERSION='1.7.2'" index.html
          grep -q 'versionChip">v1.7.2' index.html
          grep -q "cancelledPaymentIds" index.html
          grep -q "chebsel-pwa-stable-v172" sw.js
      - name: Commit
        run: |
          git config user.name 'CHEBSEL'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix finance integrity and bump v1.7.2'
          git push
