name: CHEBSEL v1.9.4 Theme Bridge
on:
  push:
    paths:
      - '.github/workflows/v194-theme-bridge.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply theme bridge
        run: python3 scripts/v194_theme_bridge.py
      - name: Bump service worker cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('sw.js');s=p.read_text(encoding='utf-8');s=re.sub(r'chebsel-pwa-stable-v\d+','chebsel-pwa-stable-v194',s);p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q "CHEBSEL v1.9.4" index.html
          grep -q "function propagateThemeToFrame" index.html
          grep -q "chebsel-parent-theme" index.html
      - name: Commit
        run: |
          git config user.name "CHEBSEL"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Release CHEBSEL v1.9.4 theme bridge" || exit 0
          git push
