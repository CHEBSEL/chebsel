name: CHEBSEL v1.5.9 Deterministic Sync Repair
on:
  push:
    paths:
      - '.github/workflows/hotfix-v159.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.5.9 repair
        run: python3 tools/apply_v159.py
      - name: Verify v1.5.9
        run: |
          grep -q "CHEBSEL v1.5.9" index.html
          grep -q "canonicalV159Members" index.html
          grep -q "syncReadyReconcilePilot" index.html
          grep -q "chebsel-pwa-stable-v159" sw.js
      - name: Commit
        run: |
          git config user.name 'CHEBSEL Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Deterministic member dedupe and pilot-only outbox v1.5.9'
          git push
