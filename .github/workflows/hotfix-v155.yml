name: CHEBSEL v1.5.5 Cloud Client Fix
on:
  push:
    paths:
      - '.github/workflows/hotfix-v155.yml'
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix cloud client initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('let CLOUD_CLIENT=null,CLOUD_SDK_LOADING=null;', 'var CLOUD_CLIENT=null,CLOUD_SDK_LOADING=null;')
          s=s.replace('CHEBSEL v1.5.4 — Centre de gestion','CHEBSEL v1.5.5 — Centre de gestion')
          s=s.replace('>v1.5.4<','>v1.5.5<')
          s=s.replace("const APP_VERSION='1.5.1'", "const APP_VERSION='1.5.5'")
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8').replace('chebsel-pwa-stable-v154','chebsel-pwa-stable-v155')
          sw.write_text(t,encoding='utf-8')
          PY
          git rm .github/workflows/hotfix-v155.yml
          git config user.name 'CHEBSEL Deployment'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Fix cloud client initialization on mobile PWA — v1.5.5'
          git push
