name: CHEBSEL v1.17.2 Secretary Monthly Report

on:
  workflow_dispatch:
  push:
    paths:
      - 'js/secretary-scope-1171.js'
      - 'scripts/v1172_secretary_monthly_report.py'
      - '.github/workflows/v1172-secretary-monthly-report.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.17.2 release metadata
        run: python scripts/v1172_secretary_monthly_report.py
      - name: Validate JavaScript
        run: |
          node --check js/secretary-scope-1171.js
          node --check js/monthly-governance-1140.js
          node --check js/corrections-1131.js
      - name: Validate monthly punctuality workflow
        run: |
          grep -q 'CHEBSEL v1.17.2' index.html
          grep -q 'secretary-scope-1171.js?v=1720' index.html
          grep -q 'generateSecretaryMonthlyPunctualityReport' js/secretary-scope-1171.js
          grep -q 'saveSecretaryMonthlyPunctualityJPEG' js/secretary-scope-1171.js
          grep -q 'modifySecretaryMonthlyPunctuality' js/secretary-scope-1171.js
          grep -q 'openSecretaryReportsHub' js/secretary-scope-1171.js
          grep -q 'chebsel-pwa-stable-v1172' sw.js
      - name: Commit release
        run: |
          if git diff --quiet; then echo 'No release diff required.'; exit 0; fi
          git config user.name 'CHEBSEL'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html manifest.webmanifest sw.js js/bootstrap.js
          git commit -m 'Release CHEBSEL v1.17.2 secretary monthly punctuality report'
          git push
