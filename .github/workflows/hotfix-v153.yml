name: CHEBSEL v1.5.3 Hotfix
on:
  push:
    paths:
      - '.github/workflows/hotfix-v153.yml'
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cloud modal for mobile PWA
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Commit hotfix
        run: |
          git rm .github/workflows/hotfix-v153.yml
          git config user.name 'CHEBSEL Deployment'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Fix Cloud configuration modal on mobile PWA — v1.5.3'
          git push