name: CHEBSEL v1.10.2 Public Visitor Sync
on:
  push:
    paths:
      - '.github/workflows/v1102-public-visitor-sync.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply public visitor sync patch
        run: python3 scripts/v1102_public_visitor_sync.py
      - name: Bump service worker cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('sw.js');s=p.read_text(encoding='utf-8');s=re.sub(r'chebsel-pwa-stable-v\d+','chebsel-pwa-stable-v1102',s);p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q "CHEBSEL v1.10.2" index.html
          grep -q "chebsel_public_snapshot" index.html
          grep -q "syncVisitorPublicSnapshot" index.html
          grep -q "PUBLIC_SNAPSHOT_KEY" index.html
      - name: Commit
        run: |
          git config user.name "CHEBSEL"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Release CHEBSEL v1.10.2 public visitor sync" || exit 0
          git push
