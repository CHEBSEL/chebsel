name: CHEBSEL v1.7.1 Finance Post-Sync Counts

on:
  push:
    paths:
      - '.github/scripts/patch_v171.py'
      - '.github/workflows/hotfix-v171.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.7.1 patch
        run: python .github/scripts/patch_v171.py
      - name: Verify v1.7.1
        run: |
          grep -q 'CHEBSEL v1.7.1' index.html
          grep -q 'Finances cloud APRÈS sync' index.html
          grep -q 'chebsel-pwa-stable-v171' sw.js
      - name: Commit
        run: |
          git config user.name 'CHEBSEL'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Show post-sync finance counts in v1.7.1'
          git push
